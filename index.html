<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编码转换</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 14px;
      padding: 30px 20px;
      margin: 0;
    }
    .container {
      max-width: 1000px;
      width: 100%;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.3px;
      color: #000;
      margin: 0 0 20px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #000;
    }
    .tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid #ccc;
    }
    .tab {
      padding: 8px 0;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab.active {
      color: #000;
      border-bottom: 2px solid #000;
    }
    .tab:hover {
      color: #000;
    }
    .converter {
      display: none;
    }
    .converter.active {
      display: block;
    }
    .row {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }
    @media (max-width: 600px) {
      .row {
        flex-direction: column;
        gap: 20px;
      }
    }
    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #000;
      display: flex;
      justify-content: space-between;
    }
    .label span:last-child {
      font-weight: 400;
      color: #555;
      font-size: 13px;
    }
    textarea {
      width: 100%;
      height: 240px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.5;
      font-family: 'SF Mono', 'Monaco', 'Menlo', 'Courier New', monospace;
      background: #fff;
      border: 1px solid #000;
      resize: vertical;
      color: #000;
      outline: none;
    }
    textarea:focus {
      border-width: 1px;
      border-color: #000;
    }
    textarea::placeholder {
      color: #999;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>编码转换</h1>

  <div class="tabs">
    <div class="tab active" data-tab="unicode">Unicode</div>
    <div class="tab" data-tab="base64">Base64</div>
    <div class="tab" data-tab="url">URL</div>
  </div>

  <!-- Unicode 转换器 -->
  <div class="converter active" id="unicodeConverter">
    <div class="row">
      <div class="col">
        <div class="label">
          <span>字符</span>
          <span>文本</span>
        </div>
        <textarea id="unicodeTextInput" placeholder="输入字符..." spellcheck="false"></textarea>
      </div>
      <div class="col">
        <div class="label">
          <span>Unicode</span>
          <span>\uXXXX \u{...}</span>
        </div>
        <textarea id="unicodeCodeInput" placeholder="输入编码..." spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <!-- Base64 转换器 -->
  <div class="converter" id="base64Converter">
    <div class="row">
      <div class="col">
        <div class="label">
          <span>字符</span>
          <span>文本</span>
        </div>
        <textarea id="base64TextInput" placeholder="输入字符..." spellcheck="false"></textarea>
      </div>
      <div class="col">
        <div class="label">
          <span>Base64</span>
          <span>编码</span>
        </div>
        <textarea id="base64CodeInput" placeholder="输入 Base64..." spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <!-- URL 转换器 -->
  <div class="converter" id="urlConverter">
    <div class="row">
      <div class="col">
        <div class="label">
          <span>字符</span>
          <span>文本</span>
        </div>
        <textarea id="urlTextInput" placeholder="输入字符..." spellcheck="false"></textarea>
      </div>
      <div class="col">
        <div class="label">
          <span>URL</span>
          <span>编码</span>
        </div>
        <textarea id="urlCodeInput" placeholder="输入 URL 编码..." spellcheck="false"></textarea>
      </div>
    </div>
  </div>
</div>

<script>
  (function(){
    "use strict";

    // 标签切换
    const tabs = document.querySelectorAll('.tab');
    const converters = document.querySelectorAll('.converter');
    
    tabs.forEach(tab => {
      tab.addEventListener('click', function() {
        const tabName = this.getAttribute('data-tab');
        
        tabs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        
        converters.forEach(c => c.classList.remove('active'));
        if (tabName === 'unicode') {
          document.getElementById('unicodeConverter').classList.add('active');
        } else if (tabName === 'base64') {
          document.getElementById('base64Converter').classList.add('active');
        } else if (tabName === 'url') {
          document.getElementById('urlConverter').classList.add('active');
        }
      });
    });

    // ========== Unicode 转换 ==========
    const unicodeTextEl = document.getElementById('unicodeTextInput');
    const unicodeCodeEl = document.getElementById('unicodeCodeInput');

    function textToUnicode(str) {
      if (!str) return '';
      let out = [];
      for (const ch of str) {
        const cp = ch.codePointAt(0);
        if (cp <= 0xFFFF) {
          out.push(`\\u${cp.toString(16).toUpperCase().padStart(4, '0')}`);
        } else {
          out.push(`\\u{${cp.toString(16).toUpperCase()}}`);
        }
      }
      return out.join('');
    }

    function unicodeToText(uni) {
      if (!uni) return '';
      let str = uni;
      str = str.replace(/\\u\{([0-9A-Fa-f]{1,6})\}/g, (_, hex) => {
        const cp = parseInt(hex, 16);
        return (cp > 0x10FFFF) ? _ : String.fromCodePoint(cp);
      });
      str = str.replace(/\\u([0-9A-Fa-f]{4})/g, (_, hex) => {
        return String.fromCharCode(parseInt(hex, 16));
      });
      return str;
    }

    let unicodeUpdating = false;
    
    unicodeTextEl.addEventListener('input', function() {
      if (unicodeUpdating) return;
      unicodeUpdating = true;
      unicodeCodeEl.value = textToUnicode(this.value);
      unicodeUpdating = false;
    });

    unicodeCodeEl.addEventListener('input', function() {
      if (unicodeUpdating) return;
      unicodeUpdating = true;
      try {
        unicodeTextEl.value = unicodeToText(this.value);
      } catch (e) {
        unicodeTextEl.value = '';
      }
      unicodeUpdating = false;
    });

    // ========== Base64 转换 ==========
    const base64TextEl = document.getElementById('base64TextInput');
    const base64CodeEl = document.getElementById('base64CodeInput');

    function textToBase64(str) {
      if (!str) return '';
      try {
        return btoa(unescape(encodeURIComponent(str)));
      } catch (e) {
        return '';
      }
    }

    function base64ToText(base64) {
      if (!base64) return '';
      try {
        return decodeURIComponent(escape(atob(base64)));
      } catch (e) {
        return '';
      }
    }

    let base64Updating = false;
    
    base64TextEl.addEventListener('input', function() {
      if (base64Updating) return;
      base64Updating = true;
      base64CodeEl.value = textToBase64(this.value);
      base64Updating = false;
    });

    base64CodeEl.addEventListener('input', function() {
      if (base64Updating) return;
      base64Updating = true;
      try {
        base64TextEl.value = base64ToText(this.value);
      } catch (e) {
        base64TextEl.value = '';
      }
      base64Updating = false;
    });

    // ========== URL 转换 ==========
    const urlTextEl = document.getElementById('urlTextInput');
    const urlCodeEl = document.getElementById('urlCodeInput');

    function textToUrl(str) {
      if (!str) return '';
      try {
        return encodeURIComponent(str);
      } catch (e) {
        return '';
      }
    }

    function urlToText(url) {
      if (!url) return '';
      try {
        return decodeURIComponent(url);
      } catch (e) {
        return '';
      }
    }

    let urlUpdating = false;
    
    urlTextEl.addEventListener('input', function() {
      if (urlUpdating) return;
      urlUpdating = true;
      urlCodeEl.value = textToUrl(this.value);
      urlUpdating = false;
    });

    urlCodeEl.addEventListener('input', function() {
      if (urlUpdating) return;
      urlUpdating = true;
      try {
        urlTextEl.value = urlToText(this.value);
      } catch (e) {
        urlTextEl.value = '';
      }
      urlUpdating = false;
    });

  })();
</script>
</body>
</html>
