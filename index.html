<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title> </title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding: 16px; max-width: 980px; }
    pre { background:#f6f8fa; padding:8px; border-radius:6px; overflow:auto; max-height:420px; white-space:pre-wrap; }
    button { margin:6px 8px 6px 0; padding:8px 12px; }
    .warn { color: #a00; }
    .ok { color: #080; }
  </style>
</head>
<body>
  <h2>  </h2>
  <p> </p>

  <div>
    <button id="btn-stop">停止写入</button>
    <button id="btn-clean">清理示例数据</button>
  </div>

  <h3>日志 / 进度</h3>
  <pre id="log">初始化...</pre>

  <script>
  (function () {
    const MB = 1024 * 1024;
    const GB = 1000 * MB;
    const TARGET_2GB_BYTES = 100 * 1024 * MB; // 2 GB = 2048 MB
    // 默认 chunk 大小（1000 MB）。可调为 2MB/4MB，但较大 chunk 可能触发单次写入限制。
    const CHUNK_SIZE = 1000 * MB;

    let running = false;
    let stopRequested = false;

    const logEl = document.getElementById('log');
    function log(...args) {
      console.log(...args);
      const t = new Date().toLocaleTimeString();
      const s = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
      logEl.textContent += `\n[${t}] ${s}`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // estimate storage if available
    async function getEstimate() {
      if (navigator.storage && navigator.storage.estimate) {
        try {
          const est = await navigator.storage.estimate();
          return est; // {quota, usage}
        } catch (e) {
          log('navigator.storage.estimate() 调用失败：', e);
          return null;
        }
      }
      return null;
    }

    function makeChunk(size, seed = 0) {
      // 生成填充的 Uint8Array（避免一次性生成过大内存）
      const arr = new Uint8Array(size);
      for (let i = 0; i < size; i++) {
        arr[i] = ((i + seed) * 17 + 31) & 0xFF;
      }
      return arr;
    }

    // IndexedDB open & ensure store
    function openDb(dbName = 'big_write_db', storeName = 'chunks') {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(dbName, 1);
        req.onupgradeneeded = (ev) => {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName);
          }
        };
        req.onsuccess = (ev) => resolve(ev.target.result);
        req.onerror = (ev) => reject(ev.target.error || ev);
      });
    }

    async function writeChunk(db, storeName, key, blob) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const st = tx.objectStore(storeName);
        const r = st.put(blob, key);
        r.onsuccess = () => resolve();
        r.onerror = (e) => reject(e);
        tx.oncomplete = () => { /* done */ };
        tx.onerror = (e) => { /* handled by r.onerror */ };
      });
    }

    async function write2GBByChunks() {
      if (running) {
        log('已有写入任务在运行，无法重复启动。');
        return;
      }
      running = true;
      stopRequested = false;
      log('开始写入 GB（分块写入），chunk =', (CHUNK_SIZE / MB).toFixed(2), 'MB');

      const est = await getEstimate();
      if (est) {
        log('Storage estimate:', est);
        if (est.quota) {
          const freeApprox = Math.max(0, (est.quota - (est.usage || 0)));
          log('估算剩余可用字节（仅供参考）：', freeApprox, '字节（约', (freeApprox / MB).toFixed(1), 'MB）');
        }
      } else {
        log('无法获取 storage estimate（浏览器可能不支持），将尝试尽可能写入。');
      }

      try {
        const db = await openDb('big_write_db', 'chunks');
        const totalBytes = TARGET_2GB_BYTES;
        const chunkBytes = CHUNK_SIZE;
        const chunks = Math.ceil(totalBytes / chunkBytes);
        log('总共要写入', (totalBytes / MB).toFixed(0), 'MB，分', chunks, '个 chunk');

        for (let i = 0; i < chunks; i++) {
          if (stopRequested) {
            log('已请求停止写入，终止过程。已写入 chunk 数：', i);
            break;
          }

          const thisSize = (i === chunks - 1) ? (totalBytes - i * chunkBytes) : chunkBytes;
          // 生成 chunk（1MB） -> Blob -> 写入
          // 为了减少内存峰值，先生成 Uint8Array 再变为 Blob，完成后允许 GC 回收
          const arr = makeChunk(thisSize, i);
          const blob = new Blob([arr], { type: 'application/octet-stream' });

          try {
            const key = 'chunk-' + String(i).padStart(8, '0');
            await writeChunk(db, 'chunks', key, blob);
            log(`已写入 chunk ${i+1}/${chunks} (${(thisSize/MB).toFixed(2)} MB)`);
          } catch (e) {
            log('写入 chunk 失败 at index', i, e);
            // 如果失败，尝试降低 chunk 大小或退出
            // 这里我们选择记录错误并停止，用户可重试或在控制台查看错误
            throw e;
          }

          // 小的延迟让浏览器处理事件循环，避免 UI 卡死
          await new Promise(r => setTimeout(r, 5));
        }

        log('写入流程结束（可能是全部写入完成或中途停止）。');
        try { db.close(); } catch (e) { /* ignore */ }
      } catch (err) {
        log('写入 2GB 过程中发生错误：', err);
        log('建议：检查控制台完整错误信息、浏览器是否弹出允许对话，或降低 chunk 大小后重试。');
      } finally {
        running = false;
      }
    }

    // 自动开始写入
    document.addEventListener('DOMContentLoaded', () => {
      log('页面加载完成，自动开始写入 GB...');
      write2GBByChunks();
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
      if (!running) { log('当前没有写入任务。'); return; }
      stopRequested = true;
      log('已请求停止写入（写入将在当前 chunk 完成后停止）');
    });

    document.getElementById('btn-clean').addEventListener('click', async () => {
      if (confirm('确认删除用于示例的 IndexedDB 数据库并释放空间吗？')) {
        log('开始删除示例 IndexedDB 数据库...');
        try {
          const delReq = indexedDB.deleteDatabase('big_write_db');
          delReq.onsuccess = () => log('IndexedDB: 删除成功');
          delReq.onerror = (e) => log('IndexedDB: 删除失败', e);
          delReq.onblocked = () => log('IndexedDB: 删除阻塞（有其他页面或 worker 打开了此 DB）');
        } catch (e) {
          log('删除 IndexedDB 异常', e);
        }
      } else {
        log('用户取消清理操作。');
      }
    });

    log('脚本就绪。页面加载后将自动开始写入 GB。');
  })();
  </script>
</body>
</html>
